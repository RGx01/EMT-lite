name: Kraken schema check

# Validates every GraphQL document the page sends (src/queries.js) against Octopus's live Kraken
# schema (scripts/check-kraken.mjs). Introspection needs no key; the job uses only GITHUB_TOKEN.
#  - weekly: opens one `kraken-schema` issue for anything deprecated or no longer valid, or comments
#    on the open one when the findings change; it does not fail for a deprecation.
#  - on a pull request that changes a query or the check: fails if a document is invalid, so a field
#    Octopus does not have cannot be merged.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - src/queries.js
      - scripts/kraken-check.js
      - scripts/check-kraken.mjs
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: kraken-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Kraken schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Validate the page's queries against the live schema
        id: check
        run: |
          set +e
          node scripts/check-kraken.mjs --out findings.json
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update the kraken-schema issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -s findings.json ] || { echo "No findings file: introspection failed."; exit 1; }
          if [ "$(jq 'length' findings.json)" -eq 0 ]; then echo "Nothing deprecated or invalid."; exit 0; fi
          digest=$(sha256sum findings.json | cut -c1-12)
          list=$(jq -r '.[] | "- **\(.kind)** `\(.document)`: \(.message)"' findings.json)
          body=$(printf 'The live Kraken schema reports these against the GraphQL documents EMT-Lite sends (`src/queries.js`). **invalid** means the page is broken now; **deprecated** means migrate before the removal date in the reason.\n\n%s\n\n`findings %s`\n\n_Auto-generated by the weekly Kraken schema check (`scripts/check-kraken.mjs`)._' "$list" "$digest")
          gh label create kraken-schema --color BFDADC \
            --description "Octopus's Kraken schema changed under a query EMT-Lite sends" 2>/dev/null || true
          num=$(gh issue list --label kraken-schema --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "[Kraken schema] a query EMT-Lite sends needs attention" --label kraken-schema --body "$body"
          elif gh issue view "$num" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF -- "findings ${digest}"; then
            echo "These findings are already on #${num}."
          else
            gh issue comment "$num" --body "$body"
          fi

      - name: Fail a pull request whose queries are invalid
        if: github.event_name == 'pull_request' && steps.check.outputs.status != '0'
        run: exit 1
